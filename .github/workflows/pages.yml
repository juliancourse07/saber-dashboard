name: Deploy dashboard
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: node --test scripts/test-detail.mjs
      - run: |
          mkdir _site
          cp index.html comparar.js historico.js dashboard.css nacional.html detalle.html _site/
          python scripts/import_annual.py _site/annual.json
          python scripts/prepare_site.py _site
      - id: compare
        run: |
          changed=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            status=$(curl --silent --show-error --retry 3 --max-time 45 -o "$RUNNER_TEMP/published-version" -w '%{http_code}' https://juliancourse07.github.io/saber-dashboard/data-version.txt)
            case "$status" in
              200) if cmp -s "$RUNNER_TEMP/published-version" _site/data-version.txt; then changed=false; fi ;;
              404) ;;
              *) echo "No se pudo verificar la versión publicada: HTTP $status"; exit 1 ;;
            esac
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - if: steps.compare.outputs.changed == 'true'
        run: python scripts/brand.py _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.compare.outputs.changed == 'true'
        with: {path: _site}
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
