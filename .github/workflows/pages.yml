name: Deploy dashboard
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts -p test_import_annual.py
      - run: node --test scripts/test-detail.mjs
      - run: |
          mkdir _site
          cp index.html detalle.html _site/
          python scripts/import_annual.py _site/annual.json
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
